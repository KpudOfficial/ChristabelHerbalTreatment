# Render.com deployment configuration
# See: https://render.com/docs/blueprint-spec

databases:
  - name: herbal-medical-db
    databaseName: herbaldb
    plan: free
    ipAllowList: []

services:
  - type: web
    name: herbal-medical-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: >
      gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    healthCheckPath: /admin/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: herbal-medical-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: herbal-medical-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://herbal-medical-frontend.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: True
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CAMPAY_APP_USERNAME
        sync: false
      - key: CAMPAY_APP_PASSWORD
        sync: false
      - key: CAMPAY_ENVIRONMENT
        value: DEV
      - key: FRONTEND_URL
        value: https://herbal-medical-frontend.onrender.com
      - key: WEB_CONCURRENCY
        value: "3"
    disk:
      name: media-disk
      mountPath: /app/media
      sizeGB: 1

  - type: web
    name: herbal-medical-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://herbal-medical-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
